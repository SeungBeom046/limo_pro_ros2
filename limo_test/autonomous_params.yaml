limo_autonomous_drive:
  ros__parameters:
    # Topic wiring
    image_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    scan_topic: /scan
    cmd_vel_topic: /cmd_vel
    debug_image_topic: /limo/autonomy/debug_image
    publish_debug_image: true
    display_debug_window: true
    debug_window_name: LIMO lane detection
    debug_window_scale: 1.0
    publish_drive_log: true
    drive_log_period_sec: 0.5
    publish_lane_log: false
    lane_log_period_sec: 0.5
    image_qos: auto
    depth_qos: auto

    # Integrated drive controller
    control_rate_hz: 20.0
    max_speed: 1.40
    min_speed: 0.18
    lane_follow_min_speed: 0.55
    caution_speed: 0.35
    straight_min_speed: 1.40
    straight_steering_threshold: 0.25
    max_angular: 1.35
    steering_smoothing: 0.22
    kp: 1.70
    ki: 0.0
    kd: 0.22
    integral_limit: 0.45
    max_lane_error_step: 0.35
    lane_hold_time_sec: 0.60
    lane_hold_speed: 0.75
    lane_hold_min_confidence: 0.12
    enable_lane_lost_drive: true
    lane_lost_steering_decay: 0.45
    lane_lost_use_lidar: true
    image_timeout_sec: 0.7
    scan_timeout_sec: 0.7
    depth_timeout_sec: 0.7
    low_obstacle_speed: 0.10
    camera_obstacle_avoid_gain: 0.45

    # Camera lane detection: camera_lane_detector.py
    roi_top_ratio: 0.38
    roi_bottom_width_ratio: 0.92
    roi_top_width_ratio: 0.18
    lookahead_ratio: 0.62
    white_lane_value_min: 150
    white_lane_saturation_max: 95
    yellow_h_min: 15
    yellow_h_max: 45
    yellow_s_min: 70
    yellow_v_min: 80
    hls_l_min: 115
    hls_s_min: 55
    gaussian_kernel_size: 5
    canny_low_threshold: 50
    canny_high_threshold: 150
    hough_threshold: 24
    hough_min_line_length: 24
    hough_max_line_gap: 28
    min_lane_slope: 0.35
    max_lane_slope: 4.5
    expected_lane_width_ratio: 0.48
    top_lane_width_ratio: 0.22
    bottom_lane_width_ratio: 0.62
    single_lane_offset_ratio: 0.24
    min_lane_confidence: 0.25
    min_lane_area: 80
    max_lane_area_ratio: 0.18
    min_lane_width_ratio: 0.18
    max_lane_width_ratio: 0.85
    max_lane_mask_ratio: 0.24
    blank_white_mask_ratio: 0.65
    min_road_ratio_for_lane: 0.05
    black_road_value_max: 120
    black_road_saturation_min: 0
    min_road_between_ratio: 0.04
    camera_obstacle_roi_top_ratio: 0.72
    camera_obstacle_center_width_ratio: 0.46
    camera_obstacle_min_ratio: 0.06
    enable_camera_low_obstacle: true

    # Lidar obstacle avoidance: lidar_obstacle_avoidance.py
    lane_lost_speed: 0.50
    lane_lost_min_speed: 0.50
    lane_lost_lidar_angle_deg: 95.0
    lane_lost_clearance_distance: 1.20
    lane_lost_open_distance: 2.50
    lane_lost_gap_gain: 0.85
    lane_lost_obstacle_gain: 0.75
    aeb_sector_deg: 45.0
    aeb_core_sector_deg: 12.0
    front_sector_deg: 45.0
    side_sector_deg: 100.0
    side_check_angle_deg: 90.0
    side_check_width_deg: 15.0
    closest_sample_count: 1
    aeb_distance: 0.20
    stop_distance: 0.50
    slow_distance: 1.20
    side_obstacle_distance: 0.34
    passable_side_clearance: 0.15
    passable_avoid_speed: 0.18
    corner_side_guard_distance: 0.22
    corner_guard_speed: 0.22
    tunnel_side_distance: 0.70
    tunnel_balance_tolerance: 0.28
    tunnel_centering_gain: 0.35
    avoid_gain: 0.85
    enable_aeb_recovery: true
    aeb_recovery_clear_distance: 0.45
    aeb_recovery_reverse_sec: 1.20
    aeb_recovery_turn_sec: 0.75
    aeb_recovery_escape_sec: 0.80
    aeb_recovery_reverse_speed: -0.25
    aeb_recovery_turn_speed: 0.05
    aeb_recovery_escape_speed: 0.18
    aeb_recovery_turn_angular: 0.85
    aeb_escape_bias_sec: 1.50
    aeb_escape_bias_angular: 0.45
    enable_lidar_slalom: true
    slalom_view_deg: 90.0
    slalom_obstacle_distance: 0.75
    slalom_min_gap_indices: 5
    slalom_kp: 1.0
    slalom_speed: 0.50
