limo_autonomous_drive:
  ros__parameters:
    image_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    scan_topic: /scan
    cmd_vel_topic: /cmd_vel
    debug_image_topic: /limo/autonomy/debug_image
    publish_debug_image: true
    publish_drive_log: true
    drive_log_period_sec: 0.5
    publish_lane_log: false
    lane_log_period_sec: 0.5
    image_qos: auto
    depth_qos: auto

    control_rate_hz: 20.0
    max_speed: 1.20
    min_speed: 0.18
    caution_speed: 0.35
    straight_min_speed: 1.00
    straight_steering_threshold: 0.18
    max_angular: 1.35

    kp: 1.45
    ki: 0.0
    kd: 0.18
    integral_limit: 0.45

    roi_top_ratio: 0.38
    expected_lane_width_ratio: 0.48
    top_lane_width_ratio: 0.22
    bottom_lane_width_ratio: 0.62
    lookahead_ratio: 0.62
    single_lane_offset_ratio: 0.24
    min_lane_area: 180
    max_lane_area_ratio: 0.18
    min_lane_confidence: 0.30
    white_lane_value_min: 105
    white_lane_saturation_max: 170
    white_lane_relative_margin: 28
    lane_search_band_count: 9
    lane_search_band_height: 20
    lane_min_band_pixels: 8
    min_lane_band_count: 3
    lane_histogram_margin_ratio: 0.08
    max_lane_peak_width_ratio: 0.09
    max_lane_x_std_ratio: 0.14
    max_lane_band_jump_ratio: 0.16
    lane_pair_width_tolerance_ratio: 0.24
    lane_pair_center_prior_ratio: 0.28
    min_lane_width_ratio: 0.18
    max_lane_width_ratio: 0.85
    max_lane_mask_ratio: 0.24
    blank_white_mask_ratio: 0.65
    blank_black_road_ratio: 1.10
    blank_black_mask_ratio: 0.0
    black_road_value_max: 120
    black_road_saturation_min: 0
    min_road_ratio_for_lane: 0.08
    reflected_road_ratio_for_lane: 0.05
    min_road_between_ratio: 0.08
    reflected_road_between_ratio: 0.03
    camera_obstacle_roi_top_ratio: 0.72
    camera_obstacle_center_width_ratio: 0.46
    camera_obstacle_min_ratio: 0.06

    enable_lane_lost_drive: true
    lane_lost_speed: 0.25
    lane_lost_min_speed: 0.25
    lane_lost_steering_decay: 0.45
    lane_lost_use_lidar: true
    lane_lost_lidar_angle_deg: 95.0
    lane_lost_clearance_distance: 1.20
    lane_lost_open_distance: 2.50
    lane_lost_gap_gain: 0.85
    lane_lost_obstacle_gain: 0.75

    aeb_sector_deg: 35.0
    front_sector_deg: 45.0
    side_sector_deg: 100.0
    closest_sample_count: 1
    aeb_distance: 0.20
    stop_distance: 0.34
    slow_distance: 0.95
    side_obstacle_distance: 0.34
    tunnel_side_distance: 0.70
    tunnel_balance_tolerance: 0.28
    tunnel_centering_gain: 0.35
    low_obstacle_speed: 0.10
    avoid_gain: 0.85
    enable_lidar_slalom: true
    slalom_view_deg: 90.0
    slalom_obstacle_distance: 0.75
    slalom_min_gap_indices: 5
    slalom_kp: 1.0
    slalom_speed: 0.25
    slalom_lane_mix: 0.35
    enable_depth_obstacle: true
    depth_timeout_sec: 0.7
    depth_near_distance: 0.45
    depth_slow_distance: 0.75
    depth_stop_ratio: 0.12
    depth_slow_ratio: 0.06
    depth_roi_top_ratio: 0.58
    depth_roi_bottom_ratio: 0.95
    depth_center_width_ratio: 0.46
    depth_side_width_ratio: 0.27
    depth_avoid_gain: 0.65

    image_timeout_sec: 0.7
    scan_timeout_sec: 0.7
